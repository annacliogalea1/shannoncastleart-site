<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shannon Castle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing">

  <!-- Background Image (Responsive) -->
  <picture>
    <source media="(max-width: 480px)" srcset="images/index-iphone.png" />
    <source media="(min-width: 481px) and (max-width: 1024px)" srcset="images/index-ipad.png" />
    <source media="(min-width: 1025px)" srcset="images/index-desktop.png" />
    <img src="images/index-desktop.png" alt="Background" class="background-image" />
  </picture>

  <!-- Overlay Image with Multiply -->
  <picture class="overlay-image multiply-blend fade-in">
    <source media="(max-width: 480px)" srcset="images/index-overlay-iphone.png" />
    <source media="(min-width: 481px) and (max-width: 1024px)" srcset="images/index-overlay-ipad.png" />
    <source media="(min-width: 1025px)" srcset="images/index-overlay-desktop.png" />
    <img src="images/index-overlay-desktop.png" alt="Overlay" />
  </picture>

  <!-- Logo (100% opacity, no blend mode) -->
  <picture class="logo-image fade-in">
    <source media="(max-width: 480px)" srcset="images/index-logo-iphone.png" />
    <source media="(min-width: 481px) and (max-width: 1024px)" srcset="images/index-logo-ipad.png" />
    <source media="(min-width: 1025px)" srcset="images/index-logo-desktop.png" />
    <img src="images/index-logo-desktop.png" alt="Logo" />
  </picture>

  <!-- Enter Button (Image-based) -->
  <picture class="enter-button fade-in">
    <source media="(max-width: 480px)" srcset="images/index-enter-iPhone.png" />
    <source media="(min-width: 481px)" srcset="images/index-enter.png" />
    <img src="images/index-enter.png" alt="Enter" />
  </picture>

  <!-- Black Overlay On Click -->
  <div class="black-fade-overlay"></div>

<script>
  const button = document.querySelector('.enter-button');
  const overlay = document.querySelector('.overlay-image');
  const bgImage = document.querySelector('.background-image');
  const blackFade = document.querySelector('.black-fade-overlay');
  const logo = document.querySelector('.logo-image');

  button.addEventListener('click', function (e) {
    e.preventDefault();

    // Fade out background, overlay, and button
    bgImage.style.opacity = '0';
    overlay.style.opacity = '0';
    button.classList.add('fade-out');

    // Fade in black overlay
    blackFade.classList.add('show-black');

    // Fade in logo
    logo.classList.add('stay');

    // After delay, redirect to home page
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 1200); // Match black fade transition
  });
</script>

</body>
</html>
