    <!-- Masonry.js -->
  <script src="js/masonry.pkgd.min.js"></script>
    <script>
      window.addEventListener('load', function () {
      const grid = document.querySelector('.masonry-gallery');
        new Masonry(grid, {
          itemSelector: 'img',
          columnWidth: 'img',
          gutter: 16,
          percentPosition: true
        });
      });
    </script>
